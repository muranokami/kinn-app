# サーバー設定
# PORT環境変数はRender等のPaaSがコンテナへ動的に割り当てて渡してくる
# (Renderの既定値は10000。ローカル開発では未設定なので8080にフォールバックする)。
server.port=${PORT:8080}

# PostgreSQL接続設定(環境に合わせて書き換えてください)。
# ユーザー名・パスワードはコードにもこのファイルにも直書きせず、ANTHROPIC_API_KEYと同じ方針で
# 環境変数から取得する(未設定時はローカル開発用のデフォルト値にフォールバックする)。
spring.datasource.url=jdbc:postgresql://localhost:5432/kinn_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate設定
# スキーマの作成・変更はFlyway(下記)が担うため、Hibernateにはvalidate
# (Entityの定義とDBの実スキーマが一致しているかのチェックのみ)を行わせる。
# 以前はupdateでHibernateが自動的にテーブルを作成・変更していたが、
# マイグレーションのバージョン管理ができないためFlywayへ移行した(項目4-6)。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway(スキーマのバージョン管理) ---
# マイグレーションファイルはsrc/main/resources/db/migrationに置く
# (V1__baseline.sqlのコメント、およびREADME.mdの「テーブル変更の運用」参照)。
# baseline-on-migrate=true: 既にテーブルが存在する既存DB(本番・各自のローカル開発DB)に対して
# 初めてFlywayを導入する際、flyway_schema_historyテーブルが無ければ自動的にbaseline
# (baseline-version=1、つまり「V1までは適用済み」とみなす記録)を行ってから移行を始める。
# これによりV1__baseline.sql自体は実行されず(既にテーブルがある前提のため)、
# V2以降のマイグレーションだけが対象になる。まだテーブルが存在しない新しいDBに対しては、
# flyway_schema_historyが最初から空でも通常どおりV1から実際に実行される
# (baseline-on-migrateはあくまで「既存スキーマがある場合の救済策」であり、
# 空のDBには影響しない)。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 日本語文字化け対策
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# AI献立提案(任意設定)。
# APIキーはこのファイルやソースコードに直接書かず、環境変数 ANTHROPIC_API_KEY から取得する。
# 未設定の場合はAI献立提案機能はルールベースの提案に自動フォールバックし、エラーにはならない。
app.ai.meal.api-key=${ANTHROPIC_API_KEY:}
app.ai.meal.api-url=${ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}
app.ai.meal.model=${ANTHROPIC_MEAL_MODEL:claude-sonnet-4-5}
app.ai.meal.max-tokens=${ANTHROPIC_MEAL_MAX_TOKENS:1024}

# トップページの自動休憩機能(休憩開始ボタン)の休憩時間(分)。
# 本番では必ず60のままにする。テスト・開発時だけ短縮したい場合は環境変数で上書きする
# (例: APP_ATTENDANCE_BREAK_MINUTES=1 で1分に短縮してタイマー・自動終了を素早く確認できる)。
app.attendance.break-minutes=${APP_ATTENDANCE_BREAK_MINUTES:60}

# 健康管理の監査ログ(health_audit_log)の保持期間(日数)。
# 自動削除バッチは未実装(保持期間の「値」をコードにハードコードしないための設定値であり、
# 将来バッチを追加した際にそのまま参照できるようにするための項目)。管理者画面には
# この値がそのまま表示される。値は暫定(365日)であり、法務・産業医確認後に見直すこと
# (docs/health-audit-legal-checklist.md の「6. 監査ログの保持期間」参照)。
app.audit.health.retention-days=${APP_AUDIT_HEALTH_RETENTION_DAYS:365}

# 健康管理データ(身長・体重・血圧・睡眠時間・体調等)の保存時暗号化(AES-256-GCM)に使う鍵。
# Base64エンコードされた32バイト(例: openssl rand -base64 32 で生成)を指定する。
# コードにもこのファイルにも実際の鍵は直書きせず、ANTHROPIC_API_KEYやDB_PASSWORDと同じ方針で
# 環境変数から取得する。未設定の場合はHealthDataEncryptor内蔵のローカル開発専用の固定キーに
# フォールバックし、起動のたびに警告ログを出す。本番・共有環境では必ず設定すること
# (セキュリティレビュー③対応。HealthDataEncryptorのjavadoc参照)。
app.security.health-encryption.key=${APP_HEALTH_ENCRYPTION_KEY:}

# 健康管理データ(身長・体重・血圧・睡眠時間・体調等)の保存時暗号化(AES-256-GCM)に使う鍵。
# Base64エンコードされた32バイト(例: openssl rand -base64 32 で生成)を指定する。
# コードにもこのファイルにも実際の鍵は直書きせず、ANTHROPIC_API_KEYやDB_PASSWORDと同じ方針で
# 環境変数から取得する。未設定の場合はHealthDataEncryptor内蔵のローカル開発専用の固定キーに
# フォールバックし、起動のたびに警告ログを出す。本番・共有環境では必ず設定すること
# (セキュリティレビュー③対応。HealthDataEncryptorのjavadoc参照)。
app.security.health-encryption.key=${APP_HEALTH_ENCRYPTION_KEY:}

# ==============================================================
# セキュリティ強化設定(2026-08-28)
# 値はいずれも環境変数で上書きできる(このファイルにはローカル開発向けのデフォルト値のみ記載)。
# 本番向けの値(Cookie属性など)は application-prod.properties にまとめている
# (起動時に --spring.profiles.active=prod 等でプロファイルを切り替えて適用する)。
# ==============================================================

# --- セッション管理 ---
# セッションタイムアウト(無操作でセッションが切れるまでの時間)。
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:30m}
# Cookie属性。開発環境はHTTPでの動作を優先しsecure=falseとする
# (secure=trueのままHTTPで動かすとブラウザがCookieを送らずログインできなくなるため)。
# SecurityConfigはこの値をJSESSIONID・XSRF-TOKEN両方に適用する。
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}
# 同一ユーザーが同時に持てるセッション(=同時ログイン端末)数の上限。
app.security.session.max-concurrent-sessions=${APP_SECURITY_MAX_SESSIONS:3}
# true: 上限超過時に新しいログイン自体を拒否する / false: 最も古いセッションを自動的に失効させる
app.security.session.max-sessions-prevents-login=${APP_SECURITY_MAX_SESSIONS_PREVENTS_LOGIN:false}

# --- ログイン試行制限(アカウント単位の一時ロック) ---
app.security.login.max-failed-attempts=${APP_SECURITY_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-duration-minutes=${APP_SECURITY_LOCK_DURATION_MINUTES:15}

# --- レート制限(IPアドレス単位。ログイン・新規登録・会社コード照会APIの総当たり対策) ---
app.security.rate-limit.login.max-requests=${APP_RATE_LIMIT_LOGIN_MAX:10}
app.security.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
app.security.rate-limit.register.max-requests=${APP_RATE_LIMIT_REGISTER_MAX:5}
app.security.rate-limit.register.window-seconds=${APP_RATE_LIMIT_REGISTER_WINDOW_SECONDS:60}
# 会社コード照会(/api/auth/company-lookup)は未認証で誰でも呼べる公開APIのため、
# 8桁の会社コードを総当たりされないようこちらにもレート制限をかける(セキュリティレビューで追加)。
# register.js側が入力欄のフォーカスアウト・変更のたびに呼ぶ作りのため、通常の入力ミス訂正では
# 引っかからないようlogin/registerよりゆるめの上限にしている。
app.security.rate-limit.company-lookup.max-requests=${APP_RATE_LIMIT_COMPANY_LOOKUP_MAX:20}
app.security.rate-limit.company-lookup.window-seconds=${APP_RATE_LIMIT_COMPANY_LOOKUP_WINDOW_SECONDS:60}

# --- HSTS(HTTPS環境でのみ実際にヘッダーが送出される) ---
app.security.hsts.max-age-seconds=${APP_SECURITY_HSTS_MAX_AGE:31536000}
