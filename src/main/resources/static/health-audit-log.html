<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 自分のデータへのアクセス履歴</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="health-top.html" class="back-link" title="健康管理トップへ戻る">&laquo; 健康管理</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">自分のデータへのアクセス履歴</p>
  </header>

  <main class="container">
    <p style="color: var(--ink-soft); font-size: 14px; margin: 0 0 16px;">
      あなたの健康データ(プロフィール・体調チェック・スコアなど)に、誰が・いつ・何をしたかの記録です。
      自分自身の操作も含め、すべての操作が記録されています。
    </p>
    <p class="audit-retention-note" id="retentionNote"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>操作者</th>
            <th>操作</th>
            <th>対象</th>
            <th>詳細</th>
            <th>アクセス元</th>
            <th>結果</th>
          </tr>
        </thead>
        <tbody id="logTbody">
          <tr class="empty-row"><td colspan="7">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/health-common.js"></script>
  <script src="js/health-audit-log.js"></script>
</body>
</html>
