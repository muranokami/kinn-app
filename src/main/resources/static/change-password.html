<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - パスワード変更</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">パスワード変更</p>
  </header>

  <main class="container auth-container">
    <!-- 管理者によるリセット直後(mustChangePassword=true)のみ表示する案内。通常の任意変更時は非表示 -->
    <p class="auth-note" id="forcedNote" hidden>
      管理者によってパスワードがリセットされました。新しいパスワードを設定してください。設定が完了するまで他の画面は利用できません。
    </p>
    <!-- 一般ユーザーが強制変更(mustChangePassword=true)以外の状況でこの画面を開いた場合の案内。
         この場合フォーム自体を隠す(一般ユーザーは自分でパスワードを変更できない仕様のため) -->
    <p class="auth-note" id="notAllowedNote" hidden>
      一般ユーザーはパスワードを自分で変更できません。パスワードの変更が必要な場合は、社内の管理者(人事・総務担当)にご依頼ください。
    </p>

    <form id="changePasswordForm" class="auth-form">
      <label class="field">ユーザーID
        <input id="loginId" type="text" autocomplete="username" required />
      </label>
      <label class="field">新しいパスワード
        <input id="newPassword" type="password" autocomplete="new-password" required minlength="8" />
      </label>
      <label class="field">新しいパスワード(確認)
        <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" />
      </label>

      <div class="field field-actions auth-actions">
        <button type="submit" class="btn btn-primary">パスワードを変更</button>
        <span class="status-msg" id="changeStatus"></span>
      </div>
    </form>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
