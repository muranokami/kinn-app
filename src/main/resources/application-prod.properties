# 本番プロファイル(--spring.profiles.active=prod で有効化)。
# application.properties の値を上書きする分だけを記載する(それ以外はデフォルトのまま)。
#
# Cookie属性(Secure/SameSite)は、本番は必ずHTTPS配信されることを前提に厳格化する。
# secure=true のCookieはHTTPでは送信されないため、必ずHTTPSでの配信とセットで使うこと。
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# 同時ログインセッション数は本番でも既定値(3)を踏襲する。厳しくしたい場合は
# 環境変数 APP_SECURITY_MAX_SESSIONS で上書きすること(この値自体はハードコードしない)。

# --- スキーマ管理(Flyway) ---
# ddl-auto=validate / baseline-on-migrate=true 自体はapplication.propertiesの設定が
# prodでもそのまま適用されるため必須ではないが、本番でスキーマがどう管理されているかを
# このファイル単体を読むだけでも分かるようにするため、明示的にも記載しておく(項目4-6)。
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# 本番データベースに対して誤って `flyway:clean`(全テーブル削除)が実行されるのを
# 防ぐための安全策。開発環境ではテスト用DBをリセットしたい場合があるため無効にしていない。
spring.flyway.clean-disabled=true

# --- リバースプロキシ配下でのクライアントIP判定(README「本番HTTPS配信チェックリスト
# パターンA」参照) ---
# Render等のPaaSはTLSをプロキシ層で終端し、アプリへはHTTP(+ X-Forwarded-* ヘッダー)で
# 中継する。これを有効にしないと、AuthController#clientIp / HealthAuditAspect#clientIp等が
# 参照する request.getRemoteAddr() が「プロキシ自身のIP」を返し続け、ログイン試行回数制限・
# 監査ログのIP記録が実質機能しなくなる。
# PaaS上のコンテナは、そのプロキシを経由しない限り外部から直接到達できないネットワーク構成に
# なっている(=このプロキシ以外の経路からのアクセスが無い)ことを前提に有効化している。
# 自前のnginx等をトラストできるIP範囲が限定できる構成に置き換える場合は、
# server.forward-headers-strategy=native + server.tomcat.remoteip.internal-proxies
# (信頼するプロキシのIPを正規表現で限定)への切り替えを検討すること。
server.forward-headers-strategy=framework
