<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 健康管理 監査ログ検索(管理者)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="admin-top.html" class="back-link" title="管理者メニューへ戻る">&laquo; 管理者メニュー</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">健康管理 監査ログ検索</p>
  </header>

  <nav class="breadcrumb"><a href="admin-top.html">管理者トップ</a><span class="crumb-sep">&rang;</span><span class="crumb-current">監査ログ検索</span></nav>

  <main class="container">
    <span class="admin-badge">管理者ビュー</span>
    <p class="admin-note">
      自分の会社に所属する従業員分の監査ログのみを検索できます。他社の記録は表示されません。
      健康情報の値そのもの(体重・血圧・体調メモなど)はログに含まれません。
    </p>
    <p class="audit-retention-note" id="retentionNote"></p>

    <div class="audit-filter-bar">
      <label>期間(開始)：<input type="date" id="fromDate" /></label>
      <label>期間(終了)：<input type="date" id="toDate" /></label>
      <label>対象ユーザー：
        <select id="targetSelect">
          <option value="">全員</option>
        </select>
      </label>
      <label>操作種別：
        <select id="actionSelect">
          <option value="">すべて</option>
          <option value="VIEW">閲覧</option>
          <option value="CREATE">登録</option>
          <option value="UPDATE">更新</option>
          <option value="DELETE">削除</option>
        </select>
      </label>
      <label>リソース：
        <select id="resourceSelect">
          <option value="">すべて</option>
          <option value="PROFILE">健康プロフィール</option>
          <option value="DAILY_CHECK">今日の体調チェック</option>
          <option value="HISTORY">体調チェック履歴</option>
          <option value="SCORE">健康スコア</option>
          <option value="TREND">健康推移グラフ</option>
          <option value="ALERT">健康アラート</option>
          <option value="ANALYSIS">勤怠×健康分析</option>
          <option value="MONTHLY_RECORD">月次健康記録</option>
          <option value="ADMIN_DASHBOARD">管理者ダッシュボード</option>
          <option value="AUDIT_LOG">監査ログ</option>
        </select>
      </label>
      <button id="searchBtn" class="btn btn-primary">検索</button>
      <span class="status-msg" id="statusMsg"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>操作者</th>
            <th>操作</th>
            <th>リソース</th>
            <th>対象ユーザー</th>
            <th>詳細</th>
            <th>アクセス元</th>
            <th>結果</th>
          </tr>
        </thead>
        <tbody id="logTbody">
          <tr class="empty-row"><td colspan="8">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/health-common.js"></script>
  <script src="js/admin-health-audit-log.js"></script>
</body>
</html>
