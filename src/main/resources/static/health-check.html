<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 今日の体調チェック</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="health-top.html" class="back-link" title="健康管理トップへ戻る">&laquo; 健康管理</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">今日の体調チェック</p>
  </header>

  <main class="container">
    <section class="event-form-wrap">
      <h2 id="checkDateLabel">今日の記録</h2>
      <form id="checkForm">
        <div class="field" style="margin-bottom:16px;">
          体調
          <div class="pill-group" id="conditionPills"></div>
        </div>

        <div class="event-form" style="margin-bottom:16px;">
          <label class="field">
            睡眠時間(h)
            <input type="number" id="sleepHours" step="0.5" min="0" max="24" />
          </label>
          <label class="field">
            運動時間(分)
            <input type="number" id="exerciseMinutes" step="5" min="0" />
          </label>
          <label class="field">
            体温(℃)
            <input type="number" id="bodyTemperature" step="0.1" min="30" max="43" />
          </label>
        </div>

        <div class="event-form" style="margin-bottom:16px;">
          <div class="field">
            疲労度(1:低い 〜 5:高い)
            <div class="scale-group" id="fatigueScale"></div>
          </div>
          <div class="field">
            ストレス度(1:低い 〜 5:高い)
            <div class="scale-group" id="stressScale"></div>
          </div>
        </div>

        <label class="field field-grow" style="margin-bottom:16px;">
          自由記入メモ
          <input type="text" id="memo" placeholder="気になることがあれば自由にどうぞ" />
        </label>

        <div class="field field-actions">
          <button type="submit" class="btn btn-success">保存</button>
          <span id="statusMsg" class="status-msg"></span>
        </div>
      </form>
    </section>

    <section>
      <h2 style="font-size:15px; letter-spacing:0.08em; color:var(--kon); border-bottom:2px solid var(--kon); display:inline-block; padding-bottom:4px; margin-bottom:16px;">
        直近の記録
      </h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>体調</th>
              <th>睡眠(h)</th>
              <th>疲労度</th>
              <th>ストレス度</th>
              <th>運動(分)</th>
              <th>体温</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody id="recentTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/health-common.js"></script>
  <script src="js/health-check.js"></script>
</body>
</html>
