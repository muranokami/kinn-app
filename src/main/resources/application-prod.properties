# 本番プロファイル(--spring.profiles.active=prod で有効化)。
# application.properties の値を上書きする分だけを記載する(それ以外はデフォルトのまま)。
#
# Cookie属性(Secure/SameSite)は、本番は必ずHTTPS配信されることを前提に厳格化する。
# secure=true のCookieはHTTPでは送信されないため、必ずHTTPSでの配信とセットで使うこと。
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# 同時ログインセッション数は本番でも既定値(3)を踏襲する。厳しくしたい場合は
# 環境変数 APP_SECURITY_MAX_SESSIONS で上書きすること(この値自体はハードコードしない)。

# --- スキーマ管理(Flyway) ---
# ddl-auto=validate / baseline-on-migrate=true 自体はapplication.propertiesの設定が
# prodでもそのまま適用されるため必須ではないが、本番でスキーマがどう管理されているかを
# このファイル単体を読むだけでも分かるようにするため、明示的にも記載しておく(項目4-6)。
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# 本番データベースに対して誤って `flyway:clean`(全テーブル削除)が実行されるのを
# 防ぐための安全策。開発環境ではテスト用DBをリセットしたい場合があるため無効にしていない。
spring.flyway.clean-disabled=true
