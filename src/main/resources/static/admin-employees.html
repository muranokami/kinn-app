<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 従業員管理</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
  <style>
    /* 管理者が2名未満の場合の警告(.admin-noteの通常の淡い色ではなく朱色で目立たせる) */
    .admin-note-warning {
      color: var(--shu-deep);
      background: var(--sun);
      border: 1px solid var(--shu);
      border-style: solid;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="admin-top.html" class="back-link" title="管理者メニューへ戻る">&laquo; 管理者メニュー</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">従業員管理</p>
  </header>

  <nav class="breadcrumb">
    <a href="admin-top.html">管理者トップ</a><span class="crumb-sep">&rang;</span><span class="crumb-current">従業員管理</span>
  </nav>

  <main class="container">
    <span class="admin-badge">管理者ビュー</span>
    <p class="admin-note">自分の会社に所属する従業員のみ表示・登録・編集・削除できます(管理者のみ操作可能)。</p>
    <!-- ログイン可能な管理者が2名未満の場合のみ表示する警告(唯一の管理者がパスワードを
         忘れると復旧できなくなるため。JSが従業員一覧の役職・状態から都度算出する) -->
    <p class="admin-note admin-note-warning" id="adminCountWarning" hidden></p>

    <div class="department-filter-bar">
      会社：<strong id="companyLabel">-</strong>
      &nbsp;部署：
      <select id="departmentFilter">
        <option value="">全部署</option>
      </select>
    </div>

    <form id="searchForm" class="employee-search-form">
      <input id="searchKeyword" type="text" placeholder="氏名・ユーザーIDで検索" />
      <button type="submit" class="btn btn-secondary">検索</button>
      <button type="button" id="newEmployeeBtn" class="btn btn-success">+ 従業員を追加</button>
      <span class="status-msg" id="listStatus"></span>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>氏名</th>
            <th>ユーザーID</th>
            <th>部署</th>
            <th>役職</th>
            <th>権限</th>
            <th>状態</th>
            <th>本日の状況</th>
          </tr>
        </thead>
        <tbody id="employeeTbody"></tbody>
      </table>
    </div>
  </main>

  <!-- 従業員詳細モーダル -->
  <div class="modal-overlay" id="detailModal" hidden>
    <div class="modal-box">
      <h2>従業員詳細</h2>
      <dl class="detail-grid" id="detailGrid"></dl>
      <div class="event-form">
        <label class="field">氏名
          <input id="editFullName" type="text" required />
        </label>
        <label class="field">役職
          <input id="editPosition" type="text" placeholder="未設定" />
        </label>
        <label class="field">メールアドレス
          <input id="editEmail" type="email" placeholder="未登録(パスワードのセルフ再設定に必要)" />
        </label>
      </div>
      <div class="event-form" style="margin-top:12px;">
        <label class="field">所属部署変更
          <select id="departmentSelect">
            <option value="">未所属</option>
          </select>
        </label>
        <label class="field">権限変更
          <select id="roleSelect">
            <option value="USER">一般ユーザー</option>
            <option value="ADMIN">管理者</option>
          </select>
        </label>
        <label class="field">アカウント状態
          <select id="enabledSelect">
            <option value="true">有効</option>
            <option value="false">無効化(退職者等)</option>
          </select>
        </label>
      </div>
      <div class="modal-close-row">
        <span class="status-msg" id="detailStatus"></span>
        <button type="button" class="btn btn-success" id="profileSaveBtn">基本情報を保存</button>
        <button type="button" class="btn btn-success" id="departmentSaveBtn">部署を保存</button>
        <button type="button" class="btn btn-success" id="roleSaveBtn">権限を保存</button>
        <button type="button" class="btn btn-success" id="enabledSaveBtn">アカウント状態を保存</button>
        <a class="btn btn-secondary" id="attendanceLink" href="#">勤怠を見る</a>
        <button type="button" class="btn btn-secondary" id="resetPasswordBtn">パスワードを強制リセット</button>
        <button type="button" class="btn btn-danger" id="deleteEmployeeBtn">削除</button>
        <button type="button" class="btn btn-secondary" id="detailCloseBtn">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 一時パスワード表示モーダル(この画面を閉じると二度と表示できない。DBにも平文では保存されない) -->
  <div class="modal-overlay" id="tempPasswordModal" hidden>
    <div class="modal-box">
      <h2>一時パスワードを発行しました</h2>
      <p class="admin-note">この画面を閉じると二度と表示できません。安全な方法で本人に伝え、必ず控えてから閉じてください。</p>
      <dl class="detail-grid">
        <dt>ユーザーID</dt><dd id="tempPasswordLoginId">-</dd>
        <dt>一時パスワード</dt>
        <dd id="tempPasswordValue" style="font-family: monospace; font-weight: 700; font-size: 1.15em; user-select: all;">-</dd>
      </dl>
      <p class="auth-note">本人は次回ログイン後、パスワード変更画面を通過するまで他の画面を利用できません。</p>
      <div class="modal-close-row">
        <button type="button" class="btn btn-secondary" id="tempPasswordCopyBtn">コピー</button>
        <button type="button" class="btn btn-success" id="tempPasswordCloseBtn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 従業員登録モーダル -->
  <div class="modal-overlay" id="createModal" hidden>
    <div class="modal-box">
      <h2>従業員を追加</h2>
      <form id="createForm">
        <div class="event-form">
          <label class="field">氏名<input id="cFullName" type="text" required /></label>
          <label class="field">ユーザーID<input id="cLoginId" type="text" required /></label>
        </div>
        <div class="event-form" style="margin-top:12px;">
          <label class="field">パスワード<input id="cPassword" type="password" required /></label>
          <label class="field">パスワード確認<input id="cConfirmPassword" type="password" required /></label>
        </div>
        <div class="event-form" style="margin-top:12px;">
          <label class="field">メールアドレス(任意)<input id="cEmail" type="email" placeholder="後から追加も可能" /></label>
        </div>
        <div class="event-form" style="margin-top:12px;">
          <label class="field">部署
            <select id="cDepartment">
              <option value="">未所属</option>
            </select>
          </label>
          <label class="field">役職<input id="cPosition" type="text" /></label>
          <label class="field">権限
            <select id="cRole">
              <option value="USER">一般ユーザー</option>
              <option value="ADMIN">管理者</option>
            </select>
          </label>
        </div>
        <div class="modal-close-row">
          <span class="status-msg" id="createStatus"></span>
          <button type="submit" class="btn btn-success">登録</button>
          <button type="button" class="btn btn-secondary" id="createCloseBtn">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth-common.js"></script>
  <script src="js/admin-employees.js"></script>
</body>
</html>
