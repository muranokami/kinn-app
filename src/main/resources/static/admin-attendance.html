<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 勤怠管理(管理者)</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/attendance-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="admin-top.html" class="back-link" title="管理者メニューへ戻る">&laquo; 管理者メニュー</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle" id="pageSubtitle">勤怠管理(管理者)</p>
  </header>

  <nav class="breadcrumb" id="breadcrumb">
    <a href="admin-top.html">管理者トップ</a><span class="crumb-sep">&rang;</span><span class="crumb-current">勤怠管理</span>
  </nav>

  <main class="container">
    <span class="admin-badge">管理者ビュー</span>
    <p class="admin-note">
      自分の会社に所属する従業員の勤怠のみを確認・修正できます。他社の情報にはアクセスできません。
    </p>

    <!-- ============ 全社員フラット一覧(デフォルト表示) ============ -->
    <section id="flatListSection">
      <!-- 部署全体・従業員名での検索(見やすさ改善: 部署プルダウンはサーバー側で絞り込み、
           従業員名は読み込み済みデータをその場でフィルタする) -->
      <div class="department-filter-bar attendance-search-bar">
        <label>部署：
          <select id="departmentFilter">
            <option value="">全部署</option>
          </select>
        </label>
        <label>従業員名：
          <input type="search" id="employeeSearchInput" placeholder="例: 山田" autocomplete="off" />
        </label>
        <span class="attendance-search-hint" id="searchHint" hidden></span>
      </div>

      <section class="period-nav">
        <div class="period-nav-row">
          <label class="closing-day-field">締め日
            <select id="closingDaySelect"></select>
          </label>
          <button id="loadBtn" class="btn btn-primary">表示</button>
        </div>
        <div class="period-label" id="periodLabel">-</div>
        <div class="period-nav-row">
          <button id="prevPeriodBtn" class="btn btn-secondary">&laquo; 前の期間</button>
          <button id="todayPeriodBtn" class="btn btn-secondary">今日</button>
          <button id="nextPeriodBtn" class="btn btn-secondary">次の期間 &raquo;</button>
          <span id="statusMsg" class="status-msg"></span>
        </div>
      </section>

      <!-- 従業員ごとにグループ化して表示する(見やすさ改善: 以前は全社員・全日付が
           1つの巨大な表にフラットに並んでおり、氏名も生のemployeeIdのまま表示されていて
           非常に見づらかったため、氏名の見出し行で区切る形に変更した) -->
      <div class="table-wrap">
        <table id="adminAttendanceTable">
          <thead>
            <tr>
              <th>日付</th>
              <th>曜日</th>
              <th>祝日</th>
              <th>勤務区分</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>実働(h)</th>
              <th>通常残業(h)</th>
              <th>所定休日残業(h)</th>
              <th>法定休日残業(h)</th>
              <th>総残業(h)</th>
            </tr>
          </thead>
          <tbody id="rowsTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ============ 従業員別カレンダー・修正(?userId=指定時) ============ -->
    <section id="employeeCalendarSection" hidden>
      <div class="field-actions" style="margin-bottom:16px;">
        <a href="admin-employees.html" class="btn btn-secondary">&laquo; 従業員一覧へ</a>
        <span id="employeeCalStatus" class="status-msg"></span>
      </div>

      <section class="period-nav">
        <div class="period-nav-row">
          <label class="closing-day-field">締め日
            <select id="calClosingDaySelect"></select>
          </label>
        </div>
        <div class="period-label" id="calPeriodLabel">-</div>
        <div class="period-nav-row">
          <button id="calPrevBtn" class="btn btn-secondary">&laquo; 前の期間</button>
          <button id="calTodayBtn" class="btn btn-secondary">今日</button>
          <button id="calNextBtn" class="btn btn-secondary">次の期間 &raquo;</button>
        </div>
      </section>

      <div class="calendar-grid" id="calendarGrid"></div>

      <section class="summary">
        <h2>月間集計</h2>
        <div class="summary-grid" id="calSummaryGrid">
          <div class="summary-item"><span class="label">通常勤務時間</span><span class="value" id="cs_regularHours">-</span><span class="unit">h</span></div>
          <div class="summary-item"><span class="label">通常残業</span><span class="value" id="cs_overtimeHours">-</span><span class="unit">h</span></div>
          <div class="summary-item"><span class="label">所定休日残業</span><span class="value" id="cs_scheduledOt">-</span><span class="unit">h</span></div>
          <div class="summary-item"><span class="label">法定休日残業</span><span class="value" id="cs_statutoryOt">-</span><span class="unit">h</span></div>
          <div class="summary-item summary-item-highlight"><span class="label">総残業</span><span class="value" id="cs_totalOt">-</span><span class="unit">h</span></div>
        </div>
      </section>

      <details class="detail-panel" id="auditPanel">
        <summary>📝 修正履歴</summary>
        <div id="auditList" style="margin-top:12px; font-size:12.5px;"></div>
      </details>
    </section>
  </main>

  <!-- 勤怠修正モーダル -->
  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal-box">
      <h2 id="editModalTitle">勤怠を修正</h2>
      <form id="editForm">
        <div class="event-form">
          <label class="field">勤務区分
            <select id="eDayType">
              <option value="NORMAL">通常勤務</option>
              <option value="SCHEDULED_HOLIDAY">所定休日</option>
              <option value="STATUTORY_HOLIDAY">法定休日</option>
              <option value="PAID_LEAVE">有給休暇</option>
              <option value="SUBSTITUTE_HOLIDAY">振替休日</option>
              <option value="COMPENSATORY_HOLIDAY">代休</option>
              <option value="ABSENCE">欠勤</option>
            </select>
          </label>
        </div>
        <div class="event-form" style="margin-top:12px;">
          <label class="field">出勤時刻<input id="eStartTime" type="time" /></label>
          <label class="field">退勤時刻<input id="eEndTime" type="time" /></label>
          <label class="field">休憩(分)<input id="eBreakMinutes" type="number" min="0" step="5" /></label>
        </div>
        <div class="event-form" style="margin-top:12px;">
          <label class="field field-grow">備考<input id="eRemarks" type="text" /></label>
        </div>
        <div class="modal-close-row">
          <span class="status-msg" id="editStatus"></span>
          <button type="submit" class="btn btn-success">保存</button>
          <button type="button" class="btn btn-secondary" id="editCloseBtn">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth-common.js"></script>
  <script src="js/attendance-period.js"></script>
  <script src="js/admin-attendance.js"></script>
</body>
</html>
