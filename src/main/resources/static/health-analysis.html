<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 勤怠×健康分析</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="health-top.html" class="back-link" title="健康管理トップへ戻る">&laquo; 健康管理</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">勤怠×健康分析</p>
  </header>

  <main class="container">
    <p style="color: var(--ink-soft); font-size: 13px; margin: 0 0 20px;">
      勤怠記録と健康記録を組み合わせた基本的な集計です。傾向をつかむための目安としてご覧ください。
    </p>

    <div class="period-tabs" id="periodTabs">
      <button class="period-tab" data-period="1w">1週間</button>
      <button class="period-tab" data-period="1m">1か月</button>
      <button class="period-tab" data-period="3m">3か月</button>
      <button class="period-tab" data-period="6m">6か月</button>
    </div>

    <section class="compare-grid">
      <div class="compare-card">
        <h3>残業時間 と 健康スコア</h3>
        <div class="compare-row"><span class="cr-label">残業が少ない日(1日2h未満)の平均スコア</span><span class="cr-value" id="scoreLowOt">-</span></div>
        <div class="compare-row"><span class="cr-label">残業が多い日(1日2h以上)の平均スコア</span><span class="cr-value" id="scoreHighOt">-</span></div>
      </div>
      <div class="compare-card">
        <h3>睡眠時間 と 疲労度</h3>
        <div class="compare-row"><span class="cr-label">睡眠が短い日(6h未満)の平均疲労度</span><span class="cr-value" id="fatigueShortSleep">-</span></div>
        <div class="compare-row"><span class="cr-label">睡眠が十分な日(6h以上)の平均疲労度</span><span class="cr-value" id="fatigueEnoughSleep">-</span></div>
      </div>
      <div class="compare-card">
        <h3>残業時間 と ストレス度</h3>
        <div class="compare-row"><span class="cr-label">残業が多い日の平均ストレス度</span><span class="cr-value" id="stressHighOt">-</span></div>
        <div class="compare-row"><span class="cr-label">残業が少ない日の平均ストレス度</span><span class="cr-value" id="stressLowOt">-</span></div>
      </div>
    </section>

    <h2 style="font-size:15px; letter-spacing:0.08em; color:var(--kon); border-bottom:2px solid var(--kon); display:inline-block; padding-bottom:4px; margin-bottom:16px;">
      日別データ
    </h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th>勤務時間(h)</th>
            <th>残業時間(h)</th>
            <th>睡眠(h)</th>
            <th>疲労度</th>
            <th>ストレス度</th>
            <th>健康スコア</th>
          </tr>
        </thead>
        <tbody id="analysisTbody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/health-common.js"></script>
  <script src="js/health-analysis.js"></script>
</body>
</html>
