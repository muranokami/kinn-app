<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - 食事履歴</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/health-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="health-top.html" class="back-link" title="健康管理トップへ戻る">&laquo; 健康管理</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">食事履歴</p>
  </header>

  <main class="container">
    <div class="period-tabs" id="periodTabs">
      <button class="period-tab" data-period="today">今日</button>
      <button class="period-tab" data-period="yesterday">昨日</button>
      <button class="period-tab" data-period="1w">1週間</button>
      <button class="period-tab" data-period="1m">1か月</button>
    </div>

    <div class="compare-grid" id="countSummary" style="margin-bottom: 24px;"></div>

    <div id="dayList" class="meal-history-list"></div>
  </main>

  <script src="js/auth-common.js"></script>
  <script src="js/health-common.js"></script>
  <script src="js/meal-history.js"></script>
</body>
</html>
