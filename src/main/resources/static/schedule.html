<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤 - スケジュール管理</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/attendance-extra.css" />
  <link rel="stylesheet" href="css/schedule-extra.css" />
  <link rel="stylesheet" href="css/auth-common.css" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="back-link" title="トップページへ戻る">&laquo; トップ</a>
    <h1 class="app-title">勤</h1>
    <p class="app-subtitle">スケジュール管理システム</p>
  </header>

  <main class="container">
    <!-- 個人/部署/すべての切り替え(④⑬)。既存の個人スケジュール機能はデフォルト(個人タブ)で
         従来どおり動作させ、部署共有スケジュール(⑨⑩⑪⑳)はタブを切り替えたときだけ表示する -->
    <section class="month-nav">
      <div class="view-tabs" id="scopeTabs">
        <button type="button" class="btn btn-secondary is-active" id="tabPersonalBtn" data-mode="personal">個人予定</button>
        <button type="button" class="btn btn-secondary" id="tabDepartmentBtn" data-mode="department">部署共有予定</button>
        <button type="button" class="btn btn-secondary" id="tabAllBtn" data-mode="all">すべて</button>
      </div>
    </section>

    <section class="month-nav">
      <button id="prevMonthBtn" class="btn btn-secondary">&laquo; 前月</button>
      <div class="month-picker">
        <input type="number" id="yearInput" min="2000" max="2100" />
        <span>年</span>
        <select id="monthSelect"></select>
        <span>月</span>
      </div>
      <button id="nextMonthBtn" class="btn btn-secondary">翌月 &raquo;</button>
      <button id="todayBtn" class="btn btn-secondary">今日</button>
      <button id="loadBtn" class="btn btn-primary">読込</button>
      <a href="admin-schedule.html" class="btn btn-secondary" id="adminScheduleLink" hidden>部署スケジュール(管理者)</a>
      <span id="statusMsg" class="status-msg"></span>
    </section>
    <section class="month-nav" id="addScheduleBar">
      <button type="button" class="btn btn-success" id="addScheduleBtn">＋ スケジュールを追加</button>
    </section>
    <p class="schedule-scope-note" id="scopeNote"></p>

    <section class="today-panel">
      <h2 id="todayPanelTitle">今日の予定</h2>
      <div id="todayEvents" class="today-events">
        <p class="snack-empty">今日の予定はありません。</p>
      </div>
    </section>

    <section class="table-wrap">
      <h2 id="calendarTitle" class="calendar-title">-</h2>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <!-- 個人予定・部署共有予定 共通の追加・編集フォーム(②)。①[スケジュールを追加]ボタン、または
         カレンダーの日付クリック(⑫)で開くまでは非表示にしておく。どちらの種類で保存するかは
         フォーム内の「種類」ラジオで選ぶ(⑪「どの画面から追加したか」ではなく「登録時に選択した
         種類」を基準にする) -->
    <section class="event-form-wrap" id="scheduleFormSection" hidden>
      <h2 id="formTitle">予定を追加</h2>
      <form id="eventForm" class="event-form">
        <div class="field field-grow" id="typeField">
          <label>種類</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="f_scheduleType" value="PERSONAL" checked /> 個人予定</label>
            <label class="radio-option"><input type="radio" name="f_scheduleType" value="DEPARTMENT" /> 部署共有予定</label>
          </div>
        </div>
        <div class="field">
          <label for="f_eventDate">日付</label>
          <input type="date" id="f_eventDate" required />
        </div>
        <div class="field">
          <label for="f_startTime">開始</label>
          <input type="time" id="f_startTime" />
        </div>
        <div class="field">
          <label for="f_endTime">終了</label>
          <input type="time" id="f_endTime" />
        </div>
        <div class="field field-grow">
          <label for="f_title">タイトル</label>
          <input type="text" id="f_title" maxlength="120" required placeholder="例: 顧客訪問" />
        </div>
        <div class="field">
          <label for="f_category">分類</label>
          <select id="f_category">
            <option value="WORK">仕事</option>
            <option value="MEETING">会議</option>
            <option value="PRIVATE">プライベート</option>
            <option value="HEALTH">通院・健康</option>
            <option value="OTHER" selected>その他</option>
          </select>
        </div>
        <div class="field field-grow">
          <label for="f_location">場所</label>
          <input type="text" id="f_location" maxlength="255" placeholder="任意" />
        </div>
        <div class="field field-grow">
          <label for="f_memo">内容・備考</label>
          <input type="text" id="f_memo" maxlength="255" placeholder="任意" />
        </div>
        <div class="field field-actions">
          <button type="submit" id="submitBtn" class="btn btn-success">追加</button>
          <button type="button" id="cancelFormBtn" class="btn btn-secondary">キャンセル</button>
        </div>
      </form>
    </section>

    <section class="summary" id="personalSummarySection">
      <h2>月次集計</h2>
      <div class="summary-grid" id="summaryGrid">
        <div class="summary-item"><span class="label">予定件数</span><span class="value" id="s_totalEvents">-</span><span class="unit">件</span></div>
        <div class="summary-item"><span class="label">仕事</span><span class="value" id="s_workCount">-</span><span class="unit">件</span></div>
        <div class="summary-item"><span class="label">会議</span><span class="value" id="s_meetingCount">-</span><span class="unit">件</span></div>
        <div class="summary-item"><span class="label">プライベート</span><span class="value" id="s_privateCount">-</span><span class="unit">件</span></div>
        <div class="summary-item"><span class="label">通院・健康</span><span class="value" id="s_healthCount">-</span><span class="unit">件</span></div>
        <div class="summary-item"><span class="label">その他</span><span class="value" id="s_otherCount">-</span><span class="unit">件</span></div>
      </div>
    </section>

    <section class="table-wrap event-list-wrap" id="personalListSection">
      <h2>予定一覧</h2>
      <table id="eventTable">
        <thead>
          <tr>
            <th>日付</th>
            <th>曜日</th>
            <th>時間</th>
            <th>タイトル</th>
            <th>分類</th>
            <th>場所</th>
            <th>内容・備考</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="eventTbody">
          <!-- JSで行を生成 -->
        </tbody>
      </table>
    </section>

    <!-- 部署共有予定のみ: 一覧(⑥⑱⑳)。「誰が登録したか」より「部署として何が予定されているか」を
         優先し、日付・時間・タイトル・場所を中心に見せる。閲覧のみ(登録・編集・削除は管理者ページ) -->
    <section class="table-wrap" id="departmentListSection" hidden>
      <h2 id="departmentListTitle">部署共有スケジュール一覧</h2>
      <div class="dept-schedule-list" id="departmentScheduleList"></div>
    </section>
  </main>

  <!-- 予定詳細モーダル(⑤⑥カレンダー・今日の予定・一覧のどこから開いても同じ画面) -->
  <div class="modal-overlay" id="detailModal" hidden>
    <div class="modal-box">
      <h2>予定の詳細</h2>
      <dl class="detail-grid" id="detailGrid"></dl>
      <div class="modal-close-row">
        <button type="button" class="btn btn-secondary" id="detailEditBtn">編集</button>
        <button type="button" class="btn btn-danger" id="detailDeleteBtn">削除</button>
        <button type="button" class="btn btn-secondary" id="detailCloseBtn">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル(⑥⑭。ブラウザ標準confirmではなく、指定どおりのボタン文言を出すため) -->
  <div class="modal-overlay" id="deleteConfirmModal" hidden>
    <div class="modal-box">
      <h2>このスケジュールを削除しますか？</h2>
      <p id="deleteConfirmSummary" class="schedule-scope-note"></p>
      <div class="modal-close-row">
        <button type="button" class="btn btn-secondary" id="deleteConfirmCancelBtn">キャンセル</button>
        <button type="button" class="btn btn-danger" id="deleteConfirmOkBtn">削除する</button>
      </div>
    </div>
  </div>

  <!-- 日別スケジュール(⑫カレンダーの日付をクリックすると開く)。その日の予定一覧+追加ボタン -->
  <div class="modal-overlay" id="dayModal" hidden>
    <div class="modal-box">
      <h2 id="dayModalTitle">-の予定</h2>
      <div id="dayModalList" class="today-events"></div>
      <div class="modal-close-row">
        <button type="button" class="btn btn-success" id="dayAddBtn">スケジュールを追加</button>
        <button type="button" class="btn btn-secondary" id="dayModalCloseBtn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="js/auth-common.js"></script>
  <script src="js/schedule-calendar.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
